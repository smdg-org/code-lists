name: Liner Codes - Upload to S3 (prod)

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (e.g. v1.0.42)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/liner-code-upload-s3.yaml
    with:
      environment: production
      ref: ${{ github.event.release.tag_name || inputs.ref }}
