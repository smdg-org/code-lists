name: Liner Codes - Release Data #${{ github.run_number }}

on:
  push:
    branches:
      - main
    paths:
      - data/liner-codes/**/*
  workflow_dispatch:

env:
  project: src/cli/SmdgCli/SmdgCli.csproj
  output_dir: data/liner-codes

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: rebuild combined
        run: |
          dotnet run --project ${{ env.project }} -- liner-codes pack combined \
            -o "${{ env.output_dir }}"

      - name: check changes
        run: |
          if ! git diff --exit-code -- "${{ env.output_dir }}/_combined.json"; then
            echo "::error::Combined liner codes are out of sync. Regenerate and commit the combined file before releasing."
            exit 1
          fi

  release-dataset:
    runs-on: ubuntu-latest
    concurrency: release-job
    needs: verify

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: pack excel
        run: |
          dotnet run --project ${{ env.project }} -- liner-codes pack excel \
            -n "${{ github.run_number }}" \
            -b "${{ github.ref_name }}" \
            -t "${{ github.token }}" \
            -r "${{ github.repository }}" \
            -o "${{ env.output_dir }}"
