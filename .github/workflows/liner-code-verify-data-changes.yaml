name: Liner Codes - Verify Data Changes #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/liner-codes/**'
      - 'src/cli/**'
      - '.github/workflows/liner-code-verify-data-changes.yaml'
      - '.github/workflows/liner-code-release-data.yaml'

env:
  version: 1.0.${{ github.run_number }}
  project: src/cli/SmdgCli/SmdgCli.csproj
  output_dir: data/liner-codes

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: pack combined
        id: pack-combined
        run: |
          dotnet run --project ${{ env.project }} -- liner-codes pack combined \
            -o "${{ env.output_dir }}"

      - name: check combined is in sync
        run: |
          if ! git diff --exit-code -- "${{ env.output_dir }}/_combined.json"; then
            echo "::error::Combined liner codes are out of sync. Run 'liner-codes pack combined -o ${{ env.output_dir }}' and commit the result."
            exit 1
          fi

  pull_request_verify:
    runs-on: ubuntu-latest
    needs: pack
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: verify
        id: verify
        run: |
          dotnet run --project ${{ env.project }} -- liner-codes verify pull-request \
            -t ${{ github.token }} \
            -r "${{ github.repository }}" \
            -p ${{ github.event.pull_request.number }} \
            -o ${{ env.output_dir }}
